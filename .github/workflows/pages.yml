name: Deploy learning space
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Build public issue snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { pathToFileURL } = require('url');
            const path = require('path');
            const { buildIssueSnapshot } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/snapshot.mjs')).href);
            const config = JSON.parse(fs.readFileSync('config.json', 'utf8'));
            const snapshot = await buildIssueSnapshot({ github, context, config });
            fs.writeFileSync('data/issue-snapshot.json', JSON.stringify(snapshot));
      - run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
