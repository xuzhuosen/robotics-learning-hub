name: Setup issue labels
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_REPO_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const { pathToFileURL } = require('url');
            const path = require('path');
            const { normalizeConfig, DOMAIN_LABELS } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'lib/core.mjs')).href);
            const config = normalizeConfig(JSON.parse(fs.readFileSync('config.json', 'utf8')));
            const targets = process.env.HAS_REPO_TOKEN === 'true' ? config.repositories : config.repositories.filter(repo => `${repo.owner}/${repo.repo}`.toLowerCase() === `${context.repo.owner}/${context.repo.repo}`.toLowerCase());
            if (targets.length < config.repositories.length) core.warning('未配置 GH_REPO_TOKEN，仅同步当前仓库；其他仓库请用已登录的 gh CLI 同步。');
            for (const target of targets) {
            const { data: repository } = await github.rest.repos.get(target);
            if (repository.private !== false) throw new Error('Label synchronization only supports configured public repositories.');
            for (const { name, color, description } of DOMAIN_LABELS) {
              try {
                await github.rest.issues.getLabel({ ...target, name });
                await github.rest.issues.updateLabel({ ...target, name, color, description });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...target, name, color, description });
              }
            }
            }
        env:
          HAS_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN != '' }}
