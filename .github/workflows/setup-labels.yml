name: Setup issue labels
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              ['backlog', 'B5BFA9', '待选任务'],
              ['ready', 'A3B8CC', '准备好，可以开始'],
              ['doing', '8BAE6E', '正在推进'],
              ['waiting', 'D4B37E', '等待硬件、依赖或帮助'],
              ['task', 'C8E5AF', '一项具体任务'],
              ['progress', 'B7D6A0', '一次进展记录'],
              ['experiment', 'CDBDE2', '可复现实验'],
              ['idea', 'E7C99E', '待讨论的想法'],
              ['help', 'E5BFB0', '向伙伴求助']
            ];
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
                await github.rest.issues.updateLabel({ ...context.repo, name, color, description });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              }
            }
